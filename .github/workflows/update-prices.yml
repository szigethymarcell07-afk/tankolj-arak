name: Árfrissítés

# Every 3 hours: download the prices, commit them when they changed, publish _site/prices.json on GitHub Pages.
# Once a day (and on a manual run) also the EV charging sites from OpenStreetMap -> _site/chargers.json.
# A push to main (e.g. a new stations.json or hand-edited evTariffs.json, published inside prices.json) also republishes.
on:
  schedule:
    - cron: '17 */3 * * *' # prices; UTC, off the full hour (scheduled runs can start a few minutes late)
    - cron: '40 2 * * *' # chargers, once a day at night (the Overpass API is a shared free service)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # commit the updated price files
  pages: write
  id-token: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # EV charging sites: daily run or manual run only. Overpass is often overloaded; a failure here (or a stale or
      # much shorter list, rejected by the script) keeps the previous chargers.json and does not stop the prices.
      - name: Töltők (OpenStreetMap)
        if: github.event.schedule == '40 2 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/build-chargers.mjs

      # Official averages: --soft skips when downloaded in the last 6 hours and never fails
      - name: Országos átlagár
        run: node scripts/update-prices.mjs --soft

      # Per-station prices: fails when the source is unreachable (the run shows the error; the steps below still save
      # and publish the rest, with the previous prices)
      - name: Kútárak
        run: node scripts/update-station-prices.mjs

      # The price file is only rewritten when a price changed or a new day started. These commits also keep
      # the schedule alive: GitHub disables scheduled workflows after 60 days without repository activity.
      - name: Változások mentése
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/data/stationPrices.json src/data/priceReference.json src/data/chargers.json
          if git diff --cached --quiet; then
            echo "Nincs változás."
          else
            git commit -m "Adatok frissítése $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      # Also checks src/data/evTariffs.json: on an error it leaves the tariffs out, publishes the rest and fails
      - name: Közzétett fájl összeállítása
        if: ${{ !cancelled() }}
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: _site
      - id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4
