name: Árfrissítés

# Download the prices, commit them when they changed, publish _site/prices.json on GitHub Pages.
# Every hour: started by the app's report server (a Cloudflare Worker cron, tankolj-reports, which calls
# workflow_dispatch with kind=prices), because GitHub's own schedule is unreliable: on 2026-09-30 and 10-01 it ran
# 3-4 times a day instead of 8, with gaps of up to 9 hours. The schedule below stays as a fallback.
# Once a day (and on a manual run from the Actions tab) also the EV charging sites from OpenStreetMap -> _site/chargers.json.
# A push to main (e.g. a new stations.json or hand-edited evTariffs.json, published inside prices.json) also republishes.
on:
  schedule:
    - cron: '17 */3 * * *' # prices, fallback; UTC, off the full hour (scheduled runs can start late or be dropped)
    - cron: '40 2 * * *' # chargers, once a day at night (the Overpass API is a shared free service)
  workflow_dispatch:
    inputs:
      kind:
        description: 'all = prices and chargers, prices = prices only (the hourly run)'
        type: string
        default: all
  push:
    branches: [main]

permissions:
  contents: write # commit the updated price files
  pages: write
  id-token: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # EV charging sites: daily run or manual run only (not the hourly kind=prices one). Overpass is often overloaded;
      # a failure here (or a stale or much shorter list, rejected by the script) keeps the previous chargers.json and
      # does not stop the prices.
      - name: Töltők (OpenStreetMap)
        if: github.event.schedule == '40 2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.kind != 'prices')
        continue-on-error: true
        run: node scripts/build-chargers.mjs

      # Official averages: --soft skips when downloaded in the last 6 hours and never fails
      - name: Országos átlagár
        run: node scripts/update-prices.mjs --soft

      # Per-station prices. The source does not answer GitHub's runners for a few minutes now and then (3 of 67 runs,
      # 2026-10-02..04; the next hour was fine), so after three retries (up to ~5 minutes) a run only warns while the
      # last successful check is under 6 hours old (--grace: a GitHub annotation, no failure mail, the previous prices
      # stay); after that, or on any other error (the page's layout changed…), it fails and the mail goes out. The
      # steps below still save and publish the rest. On a push (a code or data change republished) a source outage
      # never fails the run (--soft): the next hourly run comes anyway.
      - name: Kútárak
        run: node scripts/update-station-prices.mjs ${{ github.event_name == 'push' && '--soft' || '--grace' }}

      # The price history (history/): the national daily average and each station's price changes, from the prices
      # just checked. A failure leaves the history as it was; the prices are still saved and published.
      - name: Ártörténet
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/update-history.mjs

      # The price file is only rewritten when a price changed or a new day started. These commits also keep
      # the schedule alive: GitHub disables scheduled workflows after 60 days without repository activity.
      - name: Változások mentése
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/data/stationPrices.json src/data/priceReference.json src/data/chargers.json history
          if git diff --cached --quiet; then
            echo "Nincs változás."
          else
            git commit -m "Adatok frissítése $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      # Also checks src/data/evTariffs.json: on an error it leaves the tariffs out, publishes the rest and fails
      - name: Közzétett fájl összeállítása
        if: ${{ !cancelled() }}
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: _site
      - id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4
